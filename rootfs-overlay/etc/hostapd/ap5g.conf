# H5000M 5GHz AP（MT7992 + MT7976/MT7977，2+3 天线）
interface=ap5g
driver=nl80211
ssid=H5000M-5G
country_code=CN
hw_mode=a
channel=149
ieee80211d=1

# 11n / 11ac / 11ax（HE）
ieee80211n=1
ieee80211ac=1
ieee80211ax=1

wmm_enabled=1
auth_algs=1

# 40/80MHz：原来这里什么都没有 → hostapd 默认 20MHz，
# 协商速率被卡在 ~173Mbps。下面打开 40MHz 能力 + 80MHz 工作带宽。
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][MAX-AMSDU-7935]
vht_capab=[MAX-MPDU-11454][RXLDPC][SHORT-GI-80][TX-STBC-2BY1][RX-STBC-1][SU-BEAMFORMEE][MU-BEAMFORMEE][MAX-A-MPDU-LEN-EXP7]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=155
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=155

# ---- 可选：Wi-Fi 7 (EHT)。驱动(mt7996e)与 hostapd 都支持时才有意义；
#      开启后若 AP 起不来（hostapd 报错退出）请把下面一行注释掉再重启。
#      远程操作时建议先在串口控制台旁再试，避免把唯一的上网通道弄断。
# ieee80211be=1
