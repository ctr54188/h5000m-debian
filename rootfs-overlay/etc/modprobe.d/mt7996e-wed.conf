# MT7987 的无线 WED/PPE 硬件卸载需要厂商闭源引擎（mtk_warp.ko + mtk_wed.ko，
# 与 mt_wifi 用户态强耦合，主线 6.12 无 MT7987 支持）——实测 wed_enable=1 时
# 驱动 attach 失败：platform 15010000.wed: failed to attach wed device。
# 因此显式关闭：无线走 CPU 转发（有线 PPE 卸载不受影响，见 /etc/nftables.conf 的
# table inet hwnat / flags offload）。
options mt7996e wed_enable=0
