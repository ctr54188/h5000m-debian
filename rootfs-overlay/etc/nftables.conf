#!/usr/sbin/nft -f
# H5000M: 有线 PPE 硬件卸载 + 所有上行口(有线/5G)的 NAT
flush ruleset

table inet hwnat {
	flowtable f {
		hook ingress priority filter
		devices = { eth0, eth1 }
		flags offload
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
		ip protocol { tcp, udp } flow add @f
		ip6 nexthdr { tcp, udp } flow add @f
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		# AP 客户端 / br0 网段：从任何非 br0 接口发出时做 SNAT
		ip saddr 192.168.77.0/24 oifname != "br0" masquerade
	}
}

table inet h5000m_mgmt {
	chain input {
		type filter hook input priority filter; policy accept;
		# 管理面板只对内网开放：来自 5G 上行口(USB 网卡 enx*/wwan*)的 8181 直接丢弃
		iifname { "enx*", "wwan*", "usb*" } tcp dport 8181 counter drop
	}
}
