name: image-with-panel

# 带「MT5700M 模组管理面板」的镜像构建。
#
# 与 image.yml 的区别：多一步从 A 仓库（h5000m-mt5700-panel）取面板分发包并装进 rootfs。
#   * 只是「拉取 release / 必要时回退到源码构建」，不会触发 A 仓库的任何 workflow；
#   * A 仓库也不会触发本仓库（两个仓库没有 repository_dispatch / workflow_run 关联）；
#   * 取不到面板时默认会回退：clone A 仓库 → scripts/build.sh → 本地打成 tar.gz。
#
# 触发方式：仅手动（Actions → image-with-panel → Run workflow），或打 tag 时。
on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: '同时完整构建内核（首次约 1.5~2 小时，之后有缓存约 10~20 分钟）'
        type: boolean
        default: true
      panel_repo:
        description: '面板仓库（owner/repo）'
        type: string
        default: 'ctr54188/h5000m-mt5700-panel'
      panel_tag:
        description: '面板 tag（留空=latest release）'
        type: string
        default: ''
      panel_from_source:
        description: '不使用 release，直接从源码构建面板'
        type: boolean
        default: false
  push:
    tags: [ 'v*' ]

# 同一个 ref 同时只允许一个运行，避免「push 触发的 run」与「手动 dispatch」并发
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KVER: '6.12.103'
  HEAVY: 'true'

jobs:
  # ---------------------------------------------------------------- 快速校验
  check:
    name: 补丁校验（BSP 文件 + 内核 997/998）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y patch xz-utils curl
      - name: 校验补丁可应用性
        run: make check

  # ---------------------------------------------------------------- Debian rootfs
  rootfs:
    name: Debian rootfs（arm64 Docker 原生 + 面板）
    if: github.event_name != 'pull_request'
    needs: [ check ]
    # arm64 原生 runner：容器里 apt 是原生速度，不再走 qemu 仿真
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync xz-utils e2fsprogs dosfstools
          docker version --format '{{.Server.Version}}' || true

      - name: 取面板（release；失败则回退到源码构建）
        env:
          PANEL_REPO: ${{ inputs.panel_repo || 'ctr54188/h5000m-mt5700-panel' }}
          PANEL_TAG: ${{ inputs.panel_tag }}
        run: |
          if [ "${{ inputs.panel_from_source }}" = "true" ]; then
            echo "== 按要求直接从源码构建面板"
            PANEL_TARBALL="$(scripts/build-panel-from-source.sh)" scripts/fetch-panel.sh
          else
            scripts/fetch-panel.sh || {
              echo "!! release 取不到面板，回退到源码构建"
              PANEL_TARBALL="$(scripts/build-panel-from-source.sh)" scripts/fetch-panel.sh
            }
          fi
          ls -l build/h5000m-mt5700-panel-*.tar.gz

      - name: 构建 rootfs（arm64 原生 docker + 面板）
        run: |
          TARBALL="$(ls -t build/h5000m-mt5700-panel-*.tar.gz 2>/dev/null | head -1 || true)"
          echo "PANEL_TARBALL=$TARBALL"
          PANEL_TARBALL="$TARBALL" scripts/build-rootfs-docker.sh

      - name: 归一化属主 + 修补 Docker 绑定挂载导致的空文件
        run: |
          sudo chown -R 0:0 rootfs
          sudo bash -c 'printf "h5000m\n" > rootfs/etc/hostname'
          sudo bash -c 'printf "127.0.0.1\tlocalhost\n127.0.1.1\th5000m\n::1\t\tlocalhost ip6-localhost ip6-loopback\n" > rootfs/etc/hosts'
          sudo rm -f rootfs/etc/resolv.conf
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf rootfs/etc/resolv.conf
          sudo chmod 0644 rootfs/etc/hostname rootfs/etc/hosts
          echo "hostname=$(cat rootfs/etc/hostname) shadow_uid=$(stat -c %u rootfs/etc/shadow)"
          test -s rootfs/etc/hostname && test -s rootfs/etc/hosts && test "$(stat -c %u rootfs/etc/shadow)" = "0"

      - name: 打包 rootfs.ext4
        run: |
          truncate -s 805306368 rootfs.ext4
          # rootfs 属主是 root，mkfs -d 需要 root 权限才能读私有目录
          sudo mkfs.ext4 -F -L rootfs -d rootfs rootfs.ext4
          sudo e2fsck -fn rootfs.ext4 || true
          sha256sum rootfs.ext4 > rootfs.ext4.sha256
          sudo tar czf rootfs-overlay-$(date +%Y%m%d).tar.gz --owner=0 --group=0 -C rootfs .
          ls -lh rootfs.ext4 rootfs-overlay-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: debian-rootfs-arm64
          path: |
            rootfs.ext4
            rootfs.ext4.sha256
            rootfs-overlay-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- 内核（重）
  kernel:
    name: 内核 + 模块 + DTB（BSP 完整构建）
    if: always() && (inputs.build_kernel || startsWith(github.ref, 'refs/tags/v'))
    needs: [ check ]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: OpenWrt 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-yaml rsync unzip zlib1g-dev \
            file wget cpio time quilt

      - name: 恢复 BSP 缓存（dl + staging_dir + feeds + build_dir）
        uses: actions/cache/restore@v4
        with:
          path: |
            bsp/dl
            bsp/staging_dir
            bsp/feeds
            bsp/build_dir/host
            bsp/build_dir/toolchain-*
          # key 不包含 patches/config：改动补丁后仍能复用 1.5~2 小时的工具链构建
          key: bsp-${{ env.KVER }}-${{ github.run_id }}
          restore-keys: |
            bsp-${{ env.KVER }}-

      - name: 拉取 BSP + 打补丁
        run: |
          make bsp
          make patches
          git -C bsp status --porcelain | head -20

      - name: 主机工具 + 交叉工具链
        run: make toolchain JOBS=$(nproc)

      - name: 保存 BSP 缓存（dl/staging_dir/feeds/build_dir；失败也保存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bsp/dl
            bsp/staging_dir
            bsp/feeds
            bsp/build_dir/host
            bsp/build_dir/toolchain-*
          key: bsp-${{ env.KVER }}-${{ github.run_id }}

      - name: 构建内核 / 模块 / DTB
        run: make kernel JOBS=$(nproc)

      - name: 校验内核产物齐全（缺一即失败）
        run: |
          ls -l out/kernel
          for f in Image board.dtb modules-${{ env.KVER }}.tar.gz modules.list; do
            test -s "out/kernel/$f" || { echo "::error::缺少 out/kernel/$f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-mt7987-h5000m
          path: |
            out/kernel/Image
            out/kernel/board.dtb
            out/kernel/kernel.config
            out/kernel/modules-*.tar.gz
            out/kernel/modules.list
            out/kernel/firmware.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- 打包刷机镜像
  package:
    name: 打包 sysupgrade 镜像（.bin）
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.build_kernel)
    needs: [ kernel, rootfs ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: sudo apt-get update && sudo apt-get install -y u-boot-tools device-tree-compiler e2fsprogs

      - uses: actions/download-artifact@v4
        with:
          name: kernel-mt7987-h5000m
          path: out/kernel

      - uses: actions/download-artifact@v4
        with:
          name: debian-rootfs-arm64
          path: rootfs-artifact
        # rootfs.ext4 用作 source 太慢；这里直接解 rootfs 树
      - name: 确认下载到的内核产物
        run: |
          ls -l out/kernel || true
          for f in Image board.dtb; do
            test -s "out/kernel/$f" || { echo "::error::内核 artifact 里缺少 ${f}（内核 job 没产出？）"; exit 1; }
          done

      - name: 还原 rootfs 树
        run: |
          mkdir -p rootfs
          # overlay tar 是 --owner=0 --group=0 打的，以 root 解包即可保持 root 属主。
          # 千万不要 chown 回 runner 用户：那会让 sshd 拒绝 host key（设备 SSH 上不去）。
          sudo tar xzf rootfs-artifact/rootfs-overlay-*.tar.gz -C rootfs
          echo "shadow uid=$(stat -c %u rootfs/etc/shadow)  hostname=[$(cat rootfs/etc/hostname)]"
          test "$(stat -c %u rootfs/etc/shadow)" = "0" || { echo "::error::rootfs 属主不是 root"; exit 1; }

      - name: 装入内核模块与固件，生成 modules.dep
        run: |
          # 模块包内部是 lib/modules/<kver>/…，所以解到 rootfs 根（不是 rootfs/lib/modules/<kver>）
          sudo tar xzf out/kernel/modules-${{ env.KVER }}.tar.gz -C rootfs
          echo "模块数：$(find rootfs/lib/modules/${{ env.KVER }} -maxdepth 1 -name '*.ko' | wc -l)"
          miss=0
          for m in mt7996e mt76 mt76-connac-lib cfg80211 mac80211 cdc_ncm cdc_mbim qmi_wwan option usbnet pwm-fan xhci-mtk-hcd; do
            if find rootfs/lib/modules/${{ env.KVER }} -maxdepth 1 -name "$m.ko" | grep -q .; then
              echo "  ✓ $m.ko"
            else
              echo "::error::模块 $m.ko 没装到 /lib/modules/${{ env.KVER }}/（解包层级不对？）"; miss=1
            fi
          done
          [ "$miss" = 0 ] || exit 1
          if [ -f out/kernel/firmware.tar.gz ]; then
            sudo mkdir -p rootfs/lib/firmware
            sudo tar xzf out/kernel/firmware.tar.gz -C rootfs/lib/firmware
            echo "固件：$(find rootfs/lib/firmware -type f | wc -l) 个文件"
            ls rootfs/lib/firmware/mediatek/mt7996/mt7992_eeprom_23_2i5i.bin >/dev/null \
              && echo "  ✓ mt7992_eeprom_23_2i5i.bin（驱动实际选中的校准变体）" || echo "  ✗ 缺 MT7992 校准固件"
          fi
          sudo depmod -b "$PWD/rootfs" ${{ env.KVER }} 2>&1 | tail -3 || true
          ls rootfs/lib/modules/${{ env.KVER }}/modules.dep >/dev/null && echo "modules.dep 已生成"

      - name: 打包
        run: |
          IMAGE=out/kernel/Image DTB=out/kernel/board.dtb ROOTFS_DIR="$PWD/rootfs" scripts/package-image.sh

      - uses: actions/upload-artifact@v4
        with:
          name: h5000m-debian-image
          path: |
            out/image-*/
            out/image-*/*.sha256
          if-no-files-found: error

      - name: 发布 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/image-*/debian-13-h5000m.bin
            out/image-*/debian-13-h5000m.bin.sha256
            out/image-*/kernel.itb
            out/image-*/board.dtb
            out/kernel/modules-*.tar.gz
            rootfs-artifact/rootfs.ext4
            rootfs-artifact/rootfs.ext4.sha256
          generate_release_notes: true
          body: |
            H5000M Debian 13 (ARM64) 镜像与内核产物。

            * `debian-13-h5000m.bin` —— U-Boot 网页升级用（**只刷 Firmware 项**，
              不要动 BL2/FIP/GPT）。先核对 `sha256sum`。
            * `kernel.itb` / `board.dtb` —— 内核与设备树。
            * `modules-6.12.103.tar.gz`、`rootfs.ext4` —— 模块与根文件系统。
